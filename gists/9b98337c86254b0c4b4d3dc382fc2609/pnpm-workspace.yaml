packages:
    - apps/*
    - packages/*
    - tools/*

catalogMode: prefer

catalog:
    "@types/node": ^24
    typescript: ^7.0.2
    vite: npm:@voidzero-dev/vite-plus-core@1.1.0
    vite-plus: 1.1.0
    vitest: 5.0.3
overrides:
    vite@*: "catalog:"
    vitest@*: "catalog:"
peerDependencyRules:
    allowAny:
        - vite
        - vitest
    allowedVersions:
        vite: "*"
        vitest: "*"
allowBuilds:
    "@parcel/watcher": false
    esbuild: false
    lmdb: false
    msgpackr-extract: false
