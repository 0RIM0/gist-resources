<section (change)="onChange($event)">
	@for (item of list; track item.id) {
		<div class="row">
			<input type="checkbox" [checked]="isChecked(item)" [value]="item.id" />
			<input
				type="radio"
				[checked]="isRadio(item)"
				[disabled]="!isChecked(item)"
				[value]="item.id"
			/>
			<label>{{ item.label }}</label>
		</div>
	}
</section>
